[package]
name = "par2-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.76.0"
authors = ["zephleggett"]
description = "Pure Rust PAR2 file verification and repair library with parallel processing"
readme = "README.md"
homepage = "https://github.com/zephleggett/par2-rs"
repository = "https://github.com/zephleggett/par2-rs"
license = "MIT OR Apache-2.0"
keywords = ["par2", "parity", "repair", "verification", "reed-solomon"]
categories = ["compression", "filesystem"]
exclude = [
    ".claude/",
    "tests/data/",
    "docs/",
    "tmp/",
]

[dependencies]
md-5 = "0.10"
crc32fast = "1.4"
rayon = "1.10"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
num_cpus = "1.16"

[dev-dependencies]
tempfile = "3.23"
glob = "0.3"

[features]
# Unstable features requiring newer CPU instructions (AVX-512, GFNI)
unstable = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false

# CPU-specific optimizations (use native CPU features)
[profile.release.package."*"]
opt-level = 3

[profile.bench]
inherits = "release"
