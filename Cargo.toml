[package]
name = "par2-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80.0"
authors = ["zephleggett"]
description = "Pure Rust PAR2 file verification and repair library with parallel processing"
readme = "README.md"
homepage = "https://github.com/zephleggett/par2-rs"
repository = "https://github.com/zephleggett/par2-rs"
license = "MIT OR Apache-2.0"
keywords = ["par2", "parity", "repair", "verification", "reed-solomon"]
categories = ["compression", "filesystem"]
exclude = [
    ".claude/",
    "tests/data/",
    "docs/",
    "tmp/",
]

[dependencies]
md-5 = { version = "0.10", features = ["asm"] }
crc32fast = "1.4"
rayon = "1.10"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.23"
glob = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false

# CPU-specific optimizations (use native CPU features)
[profile.release.package."*"]
opt-level = 3

[profile.bench]
inherits = "release"

[[bench]]
name = "hash_comparison"
harness = false

[[bench]]
name = "md5_only"
harness = false

[[bench]]
name = "simd_strategies"
harness = false
