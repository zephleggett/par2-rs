name: Performance Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    name: Benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-benchmark

      - name: Report CPU features
        run: |
          echo "=== CPU Features ==="
          if [ "$(uname -s)" = "Linux" ]; then
            echo "CPU: $(grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2 | xargs)"
            echo ""
            echo "SIMD features:"
            grep -o '\(avx512[^ ]*\|avx2\|avx\|pclmulqdq\|ssse3\|sse4_1\|gfni\)' /proc/cpuinfo | sort -u || echo "  (basic x86-64)"
          else
            echo "CPU: $(sysctl -n machdep.cpu.brand_string)"
            echo ""
            echo "ARM features: NEON (always available on ARM64)"
          fi
          echo ""

      - name: Build release binaries
        run: cargo build --release --bins
        env:
          RUSTFLAGS: "-C target-cpu=native"

      - name: Run benchmark
        id: benchmark
        run: |
          chmod +x scripts/benchmark.sh
          scripts/benchmark.sh

      - name: Display results as step summary
        if: always()
        run: |
          # Helper to format KB to human readable
          format_mem() {
            local kb=$1
            if [ "$kb" -ge 1048576 ]; then
              printf "%.1fGB" "$(echo "scale=1; $kb / 1048576" | bc)"
            elif [ "$kb" -ge 1024 ]; then
              printf "%.0fMB" "$(echo "scale=0; $kb / 1024" | bc)"
            else
              printf "%dKB" "$kb"
            fi
          }

          TURBO_CREATE_MEM=$(format_mem ${{ steps.benchmark.outputs.turbo_create_mem }})
          PAR2RS_CREATE_MEM=$(format_mem ${{ steps.benchmark.outputs.par2rs_create_mem }})
          TURBO_VERIFY_MEM=$(format_mem ${{ steps.benchmark.outputs.turbo_verify_mem }})
          PAR2RS_VERIFY_MEM=$(format_mem ${{ steps.benchmark.outputs.par2rs_verify_mem }})
          TURBO_REPAIR_MEM=$(format_mem ${{ steps.benchmark.outputs.turbo_repair_mem }})
          PAR2RS_REPAIR_MEM=$(format_mem ${{ steps.benchmark.outputs.par2rs_repair_mem }})

          echo "## Benchmark (${{ steps.benchmark.outputs.platform }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Operation | par2cmdline-turbo | par2-rs | Speedup |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------------------|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Create (time) | ${{ steps.benchmark.outputs.turbo_create_time }}s | ${{ steps.benchmark.outputs.par2rs_create_time }}s | ${{ steps.benchmark.outputs.create_speedup }}x |" >> $GITHUB_STEP_SUMMARY
          echo "| Create (memory) | ${TURBO_CREATE_MEM} | ${PAR2RS_CREATE_MEM} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Verify (time) | ${{ steps.benchmark.outputs.turbo_verify_time }}s | ${{ steps.benchmark.outputs.par2rs_verify_time }}s | ${{ steps.benchmark.outputs.verify_speedup }}x |" >> $GITHUB_STEP_SUMMARY
          echo "| Verify (memory) | ${TURBO_VERIFY_MEM} | ${PAR2RS_VERIFY_MEM} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Repair (time) | ${{ steps.benchmark.outputs.turbo_repair_time }}s | ${{ steps.benchmark.outputs.par2rs_repair_time }}s | ${{ steps.benchmark.outputs.repair_speedup }}x |" >> $GITHUB_STEP_SUMMARY
          echo "| Repair (memory) | ${TURBO_REPAIR_MEM} | ${PAR2RS_REPAIR_MEM} | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "MD5: \`${{ steps.benchmark.outputs.original_md5 }}\` (verified)" >> $GITHUB_STEP_SUMMARY

      - name: Add performance annotations
        if: always()
        run: |
          VERIFY_SPEEDUP=${{ steps.benchmark.outputs.verify_speedup }}
          REPAIR_SPEEDUP=${{ steps.benchmark.outputs.repair_speedup }}

          if (( $(echo "$VERIFY_SPEEDUP > 1" | bc -l) )); then
            echo "::notice title=Verify::${VERIFY_SPEEDUP}x faster"
          fi

          if (( $(echo "$REPAIR_SPEEDUP > 1" | bc -l) )); then
            echo "::notice title=Repair::${REPAIR_SPEEDUP}x faster"
          fi

          echo "::notice title=MD5::${{ steps.benchmark.outputs.original_md5 }} verified"

      - name: Post results as comment (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const platform = '${{ steps.benchmark.outputs.platform }}';
            function formatMem(kb) {
              if (kb >= 1048576) return (kb / 1048576).toFixed(1) + 'GB';
              if (kb >= 1024) return Math.round(kb / 1024) + 'MB';
              return kb + 'KB';
            }
            const tcm = formatMem(${{ steps.benchmark.outputs.turbo_create_mem }});
            const pcm = formatMem(${{ steps.benchmark.outputs.par2rs_create_mem }});
            const tvm = formatMem(${{ steps.benchmark.outputs.turbo_verify_mem }});
            const pvm = formatMem(${{ steps.benchmark.outputs.par2rs_verify_mem }});
            const trm = formatMem(${{ steps.benchmark.outputs.turbo_repair_mem }});
            const prm = formatMem(${{ steps.benchmark.outputs.par2rs_repair_mem }});
            const lines = [
              '## Benchmark (' + platform + ')',
              '',
              '| Operation | par2cmdline-turbo | par2-rs | Speedup |',
              '|-----------|-------------------|---------|---------|',
              '| Create (time) | ${{ steps.benchmark.outputs.turbo_create_time }}s | ${{ steps.benchmark.outputs.par2rs_create_time }}s | ${{ steps.benchmark.outputs.create_speedup }}x |',
              '| Create (memory) | ' + tcm + ' | ' + pcm + ' | - |',
              '| Verify (time) | ${{ steps.benchmark.outputs.turbo_verify_time }}s | ${{ steps.benchmark.outputs.par2rs_verify_time }}s | ${{ steps.benchmark.outputs.verify_speedup }}x |',
              '| Verify (memory) | ' + tvm + ' | ' + pvm + ' | - |',
              '| Repair (time) | ${{ steps.benchmark.outputs.turbo_repair_time }}s | ${{ steps.benchmark.outputs.par2rs_repair_time }}s | ${{ steps.benchmark.outputs.repair_speedup }}x |',
              '| Repair (memory) | ' + trm + ' | ' + prm + ' | - |',
              '',
              'MD5: `${{ steps.benchmark.outputs.original_md5 }}` (verified)'
            ];
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n')
            });

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ steps.benchmark.outputs.platform }}
          path: benchmark-results-*.txt
          retention-days: 30
          if-no-files-found: warn
