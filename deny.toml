# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Deny crates with security vulnerabilities
vulnerability = "deny"
# Warn about unmaintained crates
unmaintained = "warn"
# Warn about yanked crates
yanked = "warn"
# Ignore certain advisories (add IDs here if needed)
ignore = []

[licenses]
# Allow these licenses (MIT and Apache-2.0 match the project license)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-DFS-2016",
]
# Deny licenses that are not in the allow list
default = "deny"
# Warn about licenses that need clarification
confidence-threshold = 0.8

[bans]
# Deny multiple versions of the same crate
multiple-versions = "warn"
# Warn about wildcard dependencies (we use specific versions)
wildcards = "warn"
# Allow certain duplicates if necessary (add here if needed)
skip = []
# Deny these specific crates (none currently)
deny = []

[sources]
# Deny crates from unknown registries (only allow crates.io)
unknown-registry = "deny"
# Deny git dependencies in published crates
unknown-git = "warn"
# Allow crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
